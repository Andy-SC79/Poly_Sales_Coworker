[tool.poetry]
name = "poly-ai-coworker"
version = "0.1.0"
description = "AI Coworker Template — Multi-Agent Sales & Support System"
authors = ["Andres Salavarrieta"]
readme = "README.md"
packages = [{include = "api"}, {include = "core"}, {include = "agent_core"}, {include = "agent_insurance"}, {include = "channels"}, {include = "integrations"}, {include = "workers"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.11"

# Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
python-multipart = "^0.0.9"
httpx = "^0.27.0"
supabase = "^2.10.0"

# LangGraph / LangChain core
langchain = "^0.3.0"
langgraph = "^0.2.0"
langchain-openai = "^0.2.0"
langchain-google-genai = "^2.0.0"
langchain-community = "^0.3.0"
duckduckgo-search = "^8.1.1"

# Background Tasks
arq = "^0.26.0"
redis = "^5.2.0"

# Channels
twilio = "^9.3.0"         # WhatsApp via Twilio
python-telegram-bot = "^21.6"

# Audio
openai-whisper = "^20231117"
elevenlabs = "^1.9.0"

# Utilities
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.0"
structlog = "^24.4.0"     # Structured logging

# Observability
langsmith = "^0.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
