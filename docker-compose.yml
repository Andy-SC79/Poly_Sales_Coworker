# ====================================================
# Poly AI Coworker — Docker Compose
# Levanta todo el ecosistema con: docker compose up
# ====================================================

services:

  # --------------------------------------------------
  # Main Application (FastAPI + LangGraph)
  # --------------------------------------------------
  app:
    build:
      context: .
      target: app
    container_name: poly_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app  # Live-reload in development (remove in production)
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - poly_net

  # --------------------------------------------------
  # Background Worker (ARQ + Redis)
  # --------------------------------------------------
  worker:
    build:
      context: .
      target: app
    container_name: poly_worker
    restart: unless-stopped
    command: ["python", "-m", "workers.main"]
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - poly_net

  # --------------------------------------------------
  # Redis — Cache, Sessions & Background Queue
  # --------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: poly_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - poly_net

  # --------------------------------------------------
  # Ollama — Local LLM (Optional)
  # --------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: poly_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama   # Only starts with: docker compose --profile ollama up
    networks:
      - poly_net

# --------------------------------------------------
# Volumes & Networks
# --------------------------------------------------
volumes:
  redis_data:
  ollama_data:

networks:
  poly_net:
    driver: bridge
